<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetroGo | Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- ADMIN NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">

            <a class="navbar-brand brand" href="admin.html">
                ◉ MetroGo Admin
            </a>

            <button class="btn btn-danger btn-sm" id="logoutBtn">
                Logout
            </button>

        </div>
    </nav>


    <!-- ALERT MESSAGE -->
    <div class="container mt-3" id="alertBox"></div>


    <!-- ADMIN DASHBOARD -->
    <main class="container py-5">

        <div class="mb-4">
            <div class="mini-label">Administration</div>

            <h1 class="section-title">
                Admin Dashboard
            </h1>

            <p class="muted">
                Manage MetroGo buses and routes from this page.
            </p>
        </div>


        <!-- BUS MANAGEMENT -->
        <section class="admin-only d-none" id="adminPanel">

            <div class="panel">

                <h3 class="section-title">
                    Bus Management
                </h3>

                <p class="muted">
                    Create, update and delete bus records.
                </p>


                <h5 id="busFormTitle">
                    Add new bus
                </h5>


                <!-- ADD / EDIT BUS FORM -->
                <form id="busForm">

                    <input id="busEditId" type="hidden">

                    <div class="row g-3">

                        <div class="col-md-3">
                            <label class="form-label">Bus ID</label>
                            <input
                                class="form-control"
                                name="Bus_ID"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Bus name</label>
                            <input
                                class="form-control"
                                name="Bus_Name"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Departure</label>
                            <input
                                class="form-control"
                                name="Departure"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Destination</label>
                            <input
                                class="form-control"
                                name="Destination"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Route</label>
                            <input
                                class="form-control"
                                name="Route">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Travel date</label>
                            <input
                                class="form-control"
                                name="Travel_Date"
                                type="date"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Departure time</label>
                            <input
                                class="form-control"
                                name="Departure_Time"
                                type="time"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Arrival time</label>
                            <input
                                class="form-control"
                                name="Arrival_Time"
                                type="time">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Total seats</label>
                            <input
                                class="form-control"
                                min="1"
                                name="Total_Seats"
                                type="number"
                                required>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Available seats</label>
                            <input
                                class="form-control"
                                min="0"
                                name="Available_Seats"
                                type="number"
                                required>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Fare (LKR)</label>
                            <input
                                class="form-control"
                                min="0"
                                name="Fare"
                                type="number"
                                required>
                        </div>

                        <div class="col-md-3 align-self-end">
                            <button class="btn btn-primary w-100" type="submit">
                                Save bus
                            </button>
                        </div>

                    </div>

                </form>


                <hr class="my-4">


                <!-- ALL BUSES TABLE -->
                <h5 class="mb-3">Available Bus Records</h5>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>
                            <tr>
                                <th>Bus ID</th>
                                <th>Route</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="adminBusList">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
